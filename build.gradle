plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mob_size_diversity" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mob_size_diversity_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

def mlrBuild = gradle.includedBuilds.find { it.name == "mob_loot_rebalance" }
def mlrJar = file("${rootDir}/../mob_loot_rebalance/build/libs/mob_loot_rebalance-2.0.0.jar")

tasks.register("installLocalMlr") {
	group = "run"
	description = "Copy local MLR into this project's run/mods for isolated GameTests. Play the indexed set from ../dev-pack."
	if (mlrBuild != null) {
		dependsOn mlrBuild.task(":jar")
	}
	doLast {
		if (!mlrJar.file) {
			throw new GradleException("MLR jar missing: ${mlrJar}")
		}
		def dest = file("build/run/gameTest/mods")
		dest.mkdirs()
		dest.listFiles()?.findAll { it.file && it.name.endsWith(".jar") }?.each { it.delete() }
		copy {
			from mlrJar
			into dest
		}
		logger.lifecycle("Installed {} for GameTest", mlrJar.name)
	}
}

if (mlrBuild != null) {
	tasks.configureEach { task ->
		if (task.name == "runGameTest") {
			task.dependsOn("installLocalMlr")
		}
	}
}

tasks.configureEach { task ->
	if (task.name == "runGameTest") {
		task.doFirst {
			def dest = file("build/run/gameTest/mods")
			if (mlrBuild == null && dest.directory) {
				dest.listFiles()?.findAll { it.file && it.name.contains("mob_loot_rebalance") }?.each { it.delete() }
			}
		}
	}
}

test {
	useJUnitPlatform()
	jvmArgs "-Dnet.bytebuddy.experimental=true"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

processGametestResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
