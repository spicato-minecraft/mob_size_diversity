pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

def mlrDir = file('../mob_loot_rebalance')
def mlrProps = new File(mlrDir, 'gradle.properties')
def mlrMc = ''
if (mlrProps.file) {
	def props = new Properties()
	mlrProps.withInputStream { props.load(it) }
	mlrMc = (props.getProperty('minecraft_version') ?: '').trim()
}
if (mlrDir.directory && file("${mlrDir}/settings.gradle").file && (mlrMc == '26.1' || mlrMc.startsWith('26.1.'))) {
	includeBuild(mlrDir)
}